name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Point the in-app theme download at THIS repository (theme/themes.json)
      - name: Set theme download URL
        run: sed -i "s#YOUR_USER/YOUR_REPO#${GITHUB_REPOSITORY}#g" app/src/main/res/values/strings.xml

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TvRacerLite-apk
          path: app/build/outputs/apk/release/TvRacerLite.apk

      # Tag a version (git tag v1.0 && git push --tags) to publish the APK as a GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/TvRacerLite.apk

name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project layout
        run: |
          ls -la
          test -f settings.gradle || { echo "::error::settings.gradle is not in the repo root. Upload the CONTENTS of the TVDriveLite folder, not the folder itself."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::app/src/main/AndroidManifest.xml is missing."; exit 1; }
          find app -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7 (no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key (so the APK is installable)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
            -alias tvdrive -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tvdrive123 -keypass tvdrive123 -dname "CN=TVDriveLite"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: tvdrive123
          KEY_ALIAS: tvdrive
          KEY_PASSWORD: tvdrive123
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TVDriveLite.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVDriveLite-apk
          path: TVDriveLite.apk

      - name: Upload build reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports

      - name: Publish GitHub Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mario.apk

name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create debug keystore (used to sign the APK)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Download graphics & sounds (from assets.conf / ASSET_BASE_URL)
        env:
          BASE: ${{ vars.ASSET_BASE_URL }}
        run: |
          if [ -n "$BASE" ]; then sed -i "s|^@base=.*|@base=$BASE|" app/src/main/assets/assets.conf; fi
          bash tools/fetch_assets.sh

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DrivingTestLite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrivingTestLite-apk
          path: DrivingTestLite.apk

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DrivingTestLite.apk

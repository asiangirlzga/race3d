name: Build TV Racer APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Finds the project even if the zip was extracted into a sub-folder of the repo
      - name: Locate project folder
        run: |
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found. Files in repo:"; ls -la; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"
          ls -la "$DIR"

      # Self-healing: creates the launcher icon and TV banner if they are missing from the repo
      - name: Ensure icon and banner exist
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          D=app/src/main/res/drawable
          mkdir -p "$D"
          if [ ! -f "$D/ic_launcher.xml" ]; then
            echo "Creating missing ic_launcher.xml"
            cat > "$D/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path android:fillColor="#1B2A49" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#444444" android:pathData="M42,30L54,30L84,96L12,96z" />
              <path android:fillColor="#FFFFFF" android:pathData="M47,34L49,34L50,96L46,96z" />
              <path android:fillColor="#E53935" android:pathData="M32,66h32v14h-32z" />
              <path android:fillColor="#B71C1C" android:pathData="M38,54h20l4,12h-28z" />
              <path android:fillColor="#111111" android:pathData="M30,76h6v8h-6zM60,76h6v8h-6z" />
          </vector>
          EOF
          fi
          if [ ! -f "$D/banner.xml" ]; then
            echo "Creating missing banner.xml"
            cat > "$D/banner.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#FF9A6B" android:pathData="M0,0h320v90h-320z" />
              <path android:fillColor="#2E9B4F" android:pathData="M0,90h320v90h-320z" />
              <path android:fillColor="#FFF3B0" android:pathData="M230,40a18,18 0 1,0 0.1,0z" />
              <path android:fillColor="#4A4A55" android:pathData="M145,90L175,90L290,180L30,180z" />
              <path android:fillColor="#FFFFFF" android:pathData="M158,92L162,92L168,180L152,180z" />
              <path android:fillColor="#E53935" android:pathData="M135,138h50v22h-50z" />
              <path android:fillColor="#B71C1C" android:pathData="M145,118h30l8,20h-46z" />
              <path android:fillColor="#111111" android:pathData="M130,152h12v14h-12zM178,152h12v14h-12z" />
              <path android:fillColor="#FFFFFF" android:pathData="M20,20h80v6h-80zM20,32h56v6h-56z" />
          </vector>
          EOF
          fi
          ls -la "$D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Point the in-app theme download at THIS repository
      - name: Set theme download URL
        working-directory: ${{ env.PROJECT_DIR }}
        run: sed -i "s#YOUR_USER/YOUR_REPO#${GITHUB_REPOSITORY}#g" app/src/main/res/values/strings.xml

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      # Prints ONLY the useful error lines (short) when the build fails
      - name: Show build errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "================ BUILD ERROR SUMMARY ================"
          grep -n -E "error:|warning: \[|What went wrong|Execution failed|Caused by|AAPT|R8|Could not|not found|cannot find symbol" build.log | head -40 || true
          echo "-----------------------------------------------------"
          sed -n '/What went wrong/,/Try:/p' build.log | head -30 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvRacerLite-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/TvRacerLite.apk
          if-no-files-found: error

      # Tag a version (git tag v1.0 && git push --tags) to publish the APK as a GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/TvRacerLite.apk

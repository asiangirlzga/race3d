plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvracer.lite'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvracer.lite'
        minSdk 21          // Android TV 5.0+
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the auto-generated debug key so the APK installs directly (sideload).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "TvRacerLite.apk"
        }
    }
}

// No dependencies on purpose: smallest APK, lowest RAM.
